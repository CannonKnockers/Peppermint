name: Bug report
description: Report a reproducible problem with Peppermint.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, task prompt, and relevant steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Linux Mint version, Cinnamon version, Python version, and model.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private information before sharing logs.
      render: text
